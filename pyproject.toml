[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "transformers-docs-copilot"
version = "0.1.0"
description = "Citation-grounded Q&A over a pinned subset of the Hugging Face Transformers docs"
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.2"]

[project.optional-dependencies]
retrieval = ["bm25s==0.3.16"]

[tool.setuptools]
packages = ["src"]
