[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "transformers-docs-copilot"
version = "0.1.0"
description = "Citation-grounded Q&A over a pinned subset of the Hugging Face Transformers docs"
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.2"]

[tool.setuptools]
packages = ["src"]

[project.optional-dependencies]
ml = [
    "torch>=2.6",
    "transformers==5.24.0",
    "accelerate==1.16.0",
    "safetensors==0.8.0",
    "huggingface-hub==2.4.0",
]
gpu = ["bitsandbytes==0.50.2"]
train = ["peft==0.22.0"]
